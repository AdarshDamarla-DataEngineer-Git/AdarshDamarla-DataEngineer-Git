<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Adarsh Damarla — Cloud and Big Data Engineer</title>
  <desc id="desc">Banner showing data moving through cloud ingestion, Spark processing, a lakehouse, and analytics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0b2a4a"/>
      <stop offset="1" stop-color="#123d52"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#fb6b47"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <circle cx="1060" cy="45" r="130" fill="#38bdf8" opacity="0.07"/>
  <circle cx="1130" cy="280" r="180" fill="#34d399" opacity="0.06"/>
  <circle cx="50" cy="260" r="150" fill="#fb6b47" opacity="0.06"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#f8fafc">
    <text x="70" y="92" font-size="23" font-weight="600" fill="#7dd3fc" letter-spacing="3">CLOUD · DATABRICKS · BIG DATA</text>
    <text x="70" y="151" font-size="48" font-weight="750">Adarsh Damarla</text>
    <text x="70" y="195" font-size="27" font-weight="500" fill="#cbd5e1">Data Engineer building batch, streaming, and lakehouse platforms</text>
    <text x="70" y="238" font-size="19" fill="#94a3b8">PySpark  ·  Kafka  ·  Delta Lake  ·  Airflow  ·  dbt</text>
  </g>

  <g transform="translate(790 72)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M25 77 H318" stroke="url(#line)" stroke-width="5" filter="url(#glow)"/>
    <path d="M98 67 l12 10 -12 10 M197 67 l12 10 -12 10 M291 67 l12 10 -12 10" stroke="#e2e8f0" stroke-width="3"/>

    <g transform="translate(30 38)" stroke="#38bdf8" stroke-width="4">
      <ellipse cx="25" cy="18" rx="22" ry="9"/>
      <path d="M3 18 v37 c0 5 10 9 22 9s22-4 22-9V18 M3 36c0 5 10 9 22 9s22-4 22-9"/>
    </g>

    <g transform="translate(120 40)" stroke="#fb6b47" stroke-width="4">
      <path d="M4 18 29 4l25 14-25 14L4 18Z M4 32l25 14 25-14 M4 46l25 14 25-14"/>
    </g>

    <g transform="translate(215 34)" stroke="#34d399" stroke-width="4">
      <path d="M5 18c0-7 11-13 25-13s25 6 25 13v39c0 7-11 13-25 13S5 64 5 57V18Z"/>
      <path d="M5 18c0 7 11 13 25 13s25-6 25-13 M5 38c0 7 11 13 25 13s25-6 25-13"/>
    </g>

    <g transform="translate(313 35)" stroke="#f8fafc" stroke-width="4">
      <path d="M3 62V34h12v28 M22 62V18h12v44 M41 62V7h12v55 M0 62h58"/>
    </g>
  </g>
</svg>
